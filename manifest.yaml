# Product Squad — Machine-Readable Bundle Index
# Parse this first when introspecting the bundle programmatically.
# Humans read README.md → QUICKSTART.md. Agents read AGENTS.md then this.

version: 0.5.0-pre
name: product-squad
description: Agentic operating system for one-person dev teams
license: MIT
status: pre-release
public: false  # flips to true at V1 launch

# ─── V0.5 (what exists now — runnable bits) ───────────────────────────
v0_5:
  description: |
    First playable version. Aimed at AI/product builders learning to
    scope and ship product. Two wedges, both single-command, no API
    key required (uses Claude Code subscription OAuth).
  demos:
    visual:
      entry: draw
      fixture: examples/idea-fixture.md
      output: /tmp/product-squad-demo-<ts>/
      time: ~60-120 sec
      cost: ~$0.30-0.50
      requires: [claude-code-subscription]
    scope:
      entry: scope
      fixture: examples/idea-fixture.md
      output: /tmp/product-squad-scope-<ts>/
      time: ~15-30 min (paste-and-think)
      cost: ~$0.30-0.50
      requires: [claude-code-subscription]
  commands:
    visual_ladder:
      - path: commands/sketch.md
        purpose: T0 napkin — ASCII or Mermaid layout, IA-only
      - path: commands/wireframe.md
        purpose: T1 mid-fi — multi-state HTML, spatial layout locked
      - path: commands/mockup.md
        purpose: T3 hi-fi — brand-styled HTML, single state
      - path: commands/prototype.md
        purpose: T4 interactive — single-file HTML with state transitions
      - path: commands/html-to-png.md
        purpose: Playwright HTML→PNG utility
    product_cluster:
      - path: commands/why.md
        purpose: Outcome framing / job-to-be-done
      - path: commands/shape.md
        purpose: Shape Up — options menu + capability delta + cuts
      - path: commands/experience.md
        purpose: Articulate the user delta in observable terms
      - path: commands/owit.md
        purpose: On/When/If/Then scenarios + Choices
      - path: commands/elon.md
        purpose: The Algorithm — question, delete, simplify
  templates:
    - path: .studio/design.md
      purpose: Flavor selector — points at one of the brand-flavors files
    - path: .studio/components.md
      purpose: Semantic component primitives (button, input, card, modal, nav, table, badge, empty-state) — flavor file overlays styling opinions
    - path: .studio/brand-flavors/linear.md
      purpose: Default flavor — agent OS / issue tracker / keyboard-native dev tool — dark canvas, indigo primary, Inter, hairline borders, monospace identifiers
    - path: .studio/brand-flavors/apple.md
      purpose: Premium consumer marketing — white canvas, near-monochrome, single product blue accent, large display type, generous whitespace
    - path: .studio/brand-flavors/airbnb.md
      purpose: Marketplace / photography-forward catalog — white canvas, coral primary, Plus Jakarta Sans, rounded soft-shadow cards
    - path: .studio/brand-flavors/uber.md
      purpose: Mobility platform / operational console — pure black on white, heavy display type, sharp utility radii, semantic-only color
  flavor_selection:
    mechanism: FLAVOR env var read by draw
    default: linear
    fallback: unknown flavor name → linear + warning
    docs: .studio/design.md
  docs:
    - README.md
    - AGENTS.md
    - QUICKSTART.md
    - docs/MIGRATION.md
  snapshots:
    # One-way copies from David's running pipeline. NOT scrubbed beyond the
    # demo path + the audit-flagged sensitive bits. Readable for context.
    # Source SHAs in docs/MIGRATION.md.
    - agents/foreman/  # + agents/foreman/README.md (V0.5 framing)
    - agents/sarge/    # + agents/sarge/README.md (V0.5 framing)
    - agents/code-reviewer.md
    - agents/build-fixer.md

# ─── The agent crew (per-agent V0.5 status) ───────────────────────────
agents:
  foreman:
    role: orchestrator
    snapshot_path: agents/foreman/
    readme: agents/foreman/README.md
    runnable_v0_5: false
    notes: |
      Snapshot only in V0.5. Read agents/foreman/README.md for the
      conceptual run-through. Becomes runnable + portable in V1 after
      hidden-coupling fixes.
  sarge:
    role: pm-scoping
    snapshot_path: agents/sarge/
    readme: agents/sarge/README.md
    runnable_v0_5: partial
    notes: |
      The scoping ladder (commands/why, shape, experience, owit, elon)
      ships as runnable in V0.5 via scope. Full interactive Sarge
      subagent (C0-C5) arrives V1 — see v1_roadmap.sarge_headless.
  inspector:
    role: verifier
    snapshot_path: agents/foreman/  # phase, not standalone
    runnable_v0_5: false
    notes: |
      Inspector is a Foreman phase, not a freestanding agent. Adopting
      it means adopting Foreman.
  code-reviewer:
    role: pr-reviewer
    snapshot_path: agents/code-reviewer.md
    runnable_v0_5: true
    notes: |
      Drop the .md into your ~/.claude/agents/ directory — portable
      Claude Code subagent format. Has the working-directory escape
      hatch ("(or the target repo's path if specified in the prompt)").
  build-fixer:
    role: build-repair
    snapshot_path: agents/build-fixer.md
    runnable_v0_5: true
    notes: |
      Most portable agent in the bundle. 67 lines, zero couplings.
      Drop-in subagent for any failing-build → minimal-diff fix loop.

# ─── V1 roadmap (3-4 weeks out) ───────────────────────────────────────
v1_roadmap:
  agent_abstraction:
    file: lib/agent.sh
    purpose: |
      Run any phase via $AGENT env var. Claude Code is the default;
      Codex CLI is the tested second adapter.
  portability_fixes:
    # From the V0.5 hidden-coupling audit (10 ranked findings).
    - 'orchestrator.sh:97 stat -f %m → Linux-portable (uname-gated)'
    - 'config/env.sh:47 FOREMAN_HOST default → require explicit (no default)'
    - 'config/board-ids.sh validation → abort on failure (not warn-continue)'
    - 'phases/build.sh → .index.json existence check'
    - 'orchestrator.sh:582 date +%-d → portable (strip leading zero)'
    - 'phases/review.sh — add jq presence guard before its usage sites'
    - 'config/env.sh:34 connections/slack/.env → optional + documented'
    - 'lib/questions.sh — document SLACK_BOT_TOKEN + SLACK_QUESTIONS_CHANNEL_ID prereqs'
  sarge_headless:
    file: agents/sarge/CONTRACT_HEADLESS.md
    purpose: One-shot non-interactive Sarge for any agent CLI
  cloud:
    railway:
      - cloud/railway/Dockerfile
      - cloud/railway/railway.toml
      - cloud/railway/deploy-button.md
    laptop:
      - cloud/laptop/macos-launchd.md
      - cloud/laptop/linux-cron.md
  memory:
    pattern: memory/README.md
    templates: memory/template/{user,feedback,project,reference}.md
    cli: memory/bin/memory
    adapters: memory/adapters/{claude-code,codex,aider,cursor}.md
  guardrails:
    - guardrails/issue-conventions.md
    - guardrails/spec-commits.md
    - guardrails/agent.md
    - guardrails/engineering.md
    - guardrails/AUDIT.md
  mcp: mcp/scopes.md
  bonus_commands:  # not bundled in V0.5; planned for V1
    - /flow      # T1d edge-table contract
    - /api       # API contract producer
    - /migrate   # DB schema producer
    - '@eng-deep-dive'  # codebase fit producer
    - /decompose # atomic scope decomposition
    - /spec      # aggregate tightener artifacts; advance Pitch → Scope
    - /is-ready  # pre-build readiness gate
    - /gh-issue  # create GitHub issue in contract format
  scrub: All getqatalyst / jorjani / project-specific refs (~173 hits)
  release: v1.0.0 public + soft launch (X + IndieHackers; Show HN held for V1.1)

# ─── LLM agent support ────────────────────────────────────────────────
llm_support:
  v0_5: claude-code-only
  v0_5_auth: claude-code-subscription-oauth  # no API key required
  v0_5_gotcha: |
    If ANTHROPIC_API_KEY is set in the user's env, it shadows
    subscription auth (precedence #3 vs #6 in Claude Code auth docs).
    `unset ANTHROPIC_API_KEY` if hitting org-mismatch errors.
  v1_tested:
    - claude-code
    - codex-cli
  community_welcome:  # adapters via lib/agent.sh in V1+
    - aider
    - opencode
    - cursor
    - gemini-cli

# ─── Process discipline ───────────────────────────────────────────────
process:
  behavior_changes:
    pattern: worktree-branch-pr
    naming: "<code><issue>-<slug> or exploratory <code>-<slug>"
  specs:
    pattern: direct-to-main
    note: Docs at repo root + files under specs/ and artifacts/ skip the worktree
  bypasses:
    no_verify_allowed: false
